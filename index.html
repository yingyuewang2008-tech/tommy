<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17 Fragments // Tommy</title>
    <style>
        :root {
            --main-pink: #ff7eb9;
            --soft-pink: #ffe4f0;
            --accent-red: #ff0044;
        }

        body {
            background-color: #050505;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 126, 185, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 68, 0.1) 0%, transparent 40%);
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
        }

        .ui-frame {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            pointer-events: none;
            z-index: 1;
        }

        .header {
            text-align: center;
            z-index: 10;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin: 0;
            background: linear-gradient(to right, #fff, var(--main-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 200;
        }

        .subheader {
            color: var(--accent-red);
            font-size: 0.7rem;
            letter-spacing: 4px;
            margin-top: 10px;
            opacity: 0.8;
        }

        .bouquet-container {
            position: relative;
            width: 100vw;
            height: 60vh;
            perspective: 1000px;
        }

        .flower {
            position: absolute;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.1));
        }

        .flower span:first-child {
            font-size: 3.5rem;
            filter: grayscale(0.2);
            transition: 0.3s;
        }

        .flower:hover {
            transform: scale(1.3) translateZ(50px);
            z-index: 100;
        }

        .flower:hover span:first-child {
            filter: grayscale(0) drop-shadow(0 0 20px var(--main-pink));
        }

        .label {
            font-size: 0.65rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0;
            transition: 0.3s;
        }

        .flower:hover .label {
            opacity: 1;
            background: var(--accent-red);
            border-color: var(--accent-red);
        }

        @keyframes float-slow {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-15px) rotate(2deg); }
            66% { transform: translateY(10px) rotate(-2deg); }
        }

        .footer-info {
            position: absolute;
            bottom: 40px;
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <div class="ui-frame"></div>

    <div class="header">
        <h1>HAPPY BIRTHDAY TOMMY</h1>
        <div class="subheader">SYNC RATE: 100% // 17 FRAGMENTS RECOVERED</div>
    </div>

    <div class="bouquet-container" id="bouquet"></div>

    <div class="footer-info">AUTHORIZED BY MEI // 2026.05.08</div>

    <script>
        const gifts = [
            { icon: '🌻', name: 'The Beginning', url: 'happy_birthday_tommyy (1).html' },
            { icon: '🌺', name: 'Contract', url: 'gemini-code-1778208951533 (1).html' },
            { icon: '🌼', name: '17 Days', url: 'gemini-code-1778208427207 (1).html' },
            { icon: '🌹', name: 'Sky-Link', url: 'gemini-code-1778208975244 (1).html' },
            { icon: '☘️', name: 'Archive', url: 'gemini-code-1778208978250 (1).html' },
            { icon: '🌸', name: 'VN Route', url: 'gemini-code-1778208105243 (1).html' },
            { icon: '🌷', name: 'Terminal', url: 'gemini-code-1778209579824.html' },
            { icon: '🦋', name: 'Strelitzia', url: 'strelitzia.html' },
            { icon: '📻', name: 'The Playlist', url: 'https://open.spotify.com/playlist/7H3NTB7xCGQ0pXaprTp7ub?si=3e-teSSuSvSdENbTXU1vMw' },
            { icon: '🗺️', name: 'System Map', url: 'tommy_birthday_site_v2 (1).html' }
        ];

        const container = document.getElementById('bouquet');
        
        gifts.forEach((gift, i) => {
            const el = document.createElement('a');
            el.href = gift.url;
            el.className = 'flower';
            
            // Random floating animation
            el.style.animation = `float-slow ${4 + Math.random() * 2}s infinite ease-in-out`;
            el.style.animationDelay = `${Math.random() * 2}s`;
            
            // Circular "Bouquet" layout
            const angle = (i / gifts.length) * 6.28;
            const dist = 180 + Math.random() * 60;
            const x = Math.cos(angle) * dist;
            const y = Math.sin(angle) * dist;
            
            el.style.left = `calc(50% + ${x}px)`;
            el.style.top = `calc(50% + ${y}px)`;
            
            el.innerHTML = `<span>${gift.icon}</span><span class="label">${gift.name}</span>`;
            container.appendChild(el);
        });
    </script>
</body>
</html>
